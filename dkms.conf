# build.sh copies vendor/<series of ${kernelver}>, patches it and builds it;
# see the comment at its top. PACKAGE_VERSION is filled in by the package.
#
# /updates/dkms rather than /kernel/drivers/hid: under /kernel, DKMS overwrites
# the stock module file the kernel package owns. depmod prefers updates/.
PACKAGE_NAME="logitech-bolt-hidpp"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="hid-logitech-hidpp"
BUILT_MODULE_LOCATION[0]="src/drivers/hid/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="bash ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/build.sh ${kernelver} ${kernel_source_dir}"
AUTOINSTALL="yes"
