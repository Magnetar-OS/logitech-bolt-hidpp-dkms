# build.sh copies vendor/<series of ${kernelver}>, patches it and builds it;
# see the comment at its top. PACKAGE_VERSION is filled in by the package.
#
# Installed to /updates/dkms, where depmod looks before kernel/. DKMS moves the
# stock hid-logitech-hidpp.ko.zst into /var/lib/dkms/<module>/original_module
# while this module is installed and puts it back on removal, so
# `pacman -Qkk` reports it missing in the meantime.
PACKAGE_NAME="logitech-bolt-hidpp"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="hid-logitech-hidpp"
BUILT_MODULE_LOCATION[0]="src/drivers/hid/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="bash ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/build.sh ${kernelver} ${kernel_source_dir}"
AUTOINSTALL="yes"
# Only v7.3-rc1 to v7.3-rc5 have the bug. Before 7.3, hid-logitech-dj has no
# Bolt support; from v7.3-rc6 it has none again (upstream revert
# 3fabd8ec206b). On every other kernel hid-logitech-hidpp never drives a Bolt
# device and the stock driver has nothing to fix, so DKMS skips it (with a
# BUILD_EXCLUSIVE notice) and it keeps its stock module.
#
# A regular expression on the kernel release, not _MIN/_MAX: DKMS's version
# ordering puts 7.3.0-1 before 7.3.0-rc5. The same expression is
# AFFECTED_KERNELS in build.sh; tests/test-build-plan.sh holds the two
# together.
BUILD_EXCLUSIVE_KERNEL="^7\.3\.0-rc[1-5]([^0-9]|$)"
