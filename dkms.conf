# build.sh copies vendor/<series of ${kernelver}>, patches it and builds it;
# see the comment at its top. PACKAGE_VERSION is filled in by the package.
#
# Installed to /updates/dkms, where depmod looks before kernel/. DKMS moves the
# stock hid-logitech-hidpp.ko.zst into /var/lib/dkms/<module>/original_module
# while this module is installed and puts it back on removal, so
# `pacman -Qkk` reports it missing in the meantime.
PACKAGE_NAME="logitech-bolt-hidpp"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="hid-logitech-hidpp"
BUILT_MODULE_LOCATION[0]="src/drivers/hid/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="bash ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/build.sh ${kernelver} ${kernel_source_dir}"
AUTOINSTALL="yes"
# Before 7.3, hid-logitech-dj has no Bolt support, hid-logitech-hidpp never
# drives a Bolt device, and so the stock driver has no bug to fix. DKMS skips
# those kernels (with a BUILD_EXCLUSIVE notice) and they keep their stock
# module.
BUILD_EXCLUSIVE_KERNEL_MIN="7.3"
